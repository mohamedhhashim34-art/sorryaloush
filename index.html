<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>علوش ❤️</title>
<style>
:root{
  --bg:#0b0b10;
  --text:#f7f4f6;
  --muted:#a7a1a6;
  --pink:#ff6f91;
  --pink-soft:#ff9db4;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  padding:24px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,rgba(255,111,145,.10),transparent 26%),
    radial-gradient(circle at 80% 16%,rgba(151,112,255,.08),transparent 24%),
    linear-gradient(180deg,#09090d 0%,#0e0e14 100%);
}
.page{width:min(980px,96vw);position:relative}
.top{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 2px;
  font-size:12px;color:#77727a;letter-spacing:.14em;text-transform:uppercase
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 18px rgba(255,111,145,.65)}
.hero{
  min-height:620px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:72px 22px 32px;
}
.content{width:min(720px,100%)}
.small{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--pink-soft);font-size:13px;font-weight:700;
  letter-spacing:.08em;margin-bottom:18px
}
h1{
  margin:0;
  font-size:clamp(46px,8vw,84px);
  line-height:.98;
  letter-spacing:-.055em;
  font-weight:850
}
p{
  margin:22px auto 0;
  max-width:590px;
  color:var(--muted);
  font-size:clamp(16px,2.3vw,19px);
  line-height:1.9
}
.actions-zone{
  position:relative;
  width:min(520px,100%);
  height:160px;
  margin:38px auto 0;
}
.actions-row{
  position:absolute;
  inset:0 auto auto 50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  align-items:center;
  justify-content:center;
  width:max-content;
}
button{
  appearance:none;
  border:0;
  height:52px;
  min-width:150px;
  padding:0 24px;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease
}
#yesBtn{
  color:#221017;
  background:linear-gradient(135deg,#ff7c9a,#ffacc0);
  box-shadow:0 12px 32px rgba(255,111,145,.22)
}
#yesBtn:hover{transform:translateY(-2px)}
#noBtn{
  color:#ece8ec;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}
.note{font-size:12px;color:#6f6970;margin-top:8px}

.hidden{display:none!important}

.love{
  min-height:620px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:60px 20px 30px
}
.love-inner{width:min(760px,100%)}
.love-label{font-size:12px;color:var(--pink-soft);letter-spacing:.15em;text-transform:uppercase;font-weight:800}
.love-title{font-size:clamp(32px,5vw,52px);font-weight:850;margin-top:8px;letter-spacing:-.035em}
.poem{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.45;letter-spacing:0;font-size:clamp(26px,4vw,40px)}
.love-sub{color:var(--muted);margin-top:8px;font-size:15px}
.heart-stage{
  margin:18px auto 0;
  width:min(680px,96vw);
  min-height:430px;
  display:grid;
  place-items:center;
}
.heart-text{
  direction:ltr;
  text-align:left;
  white-space:pre;
  font-family:"Courier New",monospace;
  font-size:clamp(6px,.92vw,9.5px);
  line-height:1;
  color:#ff84a4;
  text-shadow:0 0 12px rgba(255,111,145,.25);
  user-select:none;
}
.final{
  opacity:0;
  transform:translateY(8px);
  transition:.65s ease;
  font-size:18px;
  font-weight:800;
  margin-top:10px
}
.final.show{opacity:1;transform:none}
.replay{
  margin-top:18px;
  background:transparent;
  color:#aaa4ab;
  border:1px solid var(--line);
  min-width:auto;
  height:42px;
  padding:0 16px;
  font-size:13px
}

.hearts-overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}
.float-heart{
  color:#ff1f3d;
  position:absolute;
  bottom:-40px;
  opacity:0;
  pointer-events:none;
  animation:heartFloat 4.4s ease-out forwards;
  filter:drop-shadow(0 4px 10px rgba(255,0,60,.25));
}
@keyframes heartFloat{
  0%{opacity:0;transform:translateY(30px) scale(.65) rotate(0deg)}
  12%{opacity:1}
  100%{opacity:0;transform:translateY(-115vh) scale(1.35) rotate(18deg)}
}

@media(max-width:620px){
  body{padding:14px}
  .hero,.love{min-height:590px;padding-left:8px;padding-right:8px}
  .actions-zone{height:190px}
  .heart-stage{min-height:390px}
  .heart-text{font-size:5.8px}
}

.float-heart{
  color:#ff1f3d;
  position:absolute;
  bottom:10%;
  font-size:20px;
  opacity:0;
  pointer-events:none;
  animation:heartFloat 3.2s ease-out forwards;
  filter:drop-shadow(0 4px 10px rgba(255,0,60,.25));
}
@keyframes heartFloat{
  0%{opacity:0;transform:translateY(20px) scale(.7) rotate(0deg)}
  18%{opacity:1}
  100%{opacity:0;transform:translateY(-180px) scale(1.25) rotate(14deg)}
}

</style>
</head>

<main class="page">
  <div class="top">
    <span>for aloush</span>
    <span class="dot"></span>
  </div>

  <section class="hero" id="sorryScreen">
    <div class="content">
      <div class="small">❤️ رسالة صغيرة جدًا</div>
      <h1>علوش<br>ماتزعلش مني</h1>
      <p>أنا كان ممكن أقولك حقك عليا وخلاص<br>بس حسيت إنك تستاهل حاجة ألطف من كده شوية</p>

      <div class="actions-zone" id="zone">
        <div class="actions-row" id="row">
          <button id="yesBtn">سامحتك ❤️</button>
          <button id="noBtn">لسه زعلان</button>
        </div>
      </div>

      <div class="note">اختار براحتك... بس في اختيارات عندها رأي تاني 😭</div>
    </div>
  </section>

  <section class="love hidden" id="loveScreen">
    <div class="love-inner" id="loveInner">
      <div class="love-label">accepted</div>
      <div class="love-title poem">أحبك... حتى يتم انطفائي ❤️</div>
      <div class="love-sub" id="loveStatus">استنى... في حاجة بتتكتبلك</div>

      <div class="heart-stage">
        <div class="heart-text" id="heartText"></div>
      </div>

      <div class="final" id="finalMsg">I love you Aloush ❤️</div>
      <button class="replay hidden" id="replayBtn">شوفها تاني</button>
    </div>
  </section>
</main>

<script>
const sorry=document.getElementById('sorryScreen');
const love=document.getElementById('loveScreen');
const yes=document.getElementById('yesBtn');
const no=document.getElementById('noBtn');
const zone=document.getElementById('zone');
const row=document.getElementById('row');
const heartText=document.getElementById('heartText');
const finalMsg=document.getElementById('finalMsg');
const replayBtn=document.getElementById('replayBtn');
const heartsOverlay=document.getElementById('heartsOverlay');
const loveAudio=document.getElementById('loveAudio');
const loveStatus=document.getElementById('loveStatus');
const loveInner=document.getElementById('loveInner');

let escaped=false;

function moveNo(){
  const z=zone.getBoundingClientRect();
  const y=yes.getBoundingClientRect();
  const n=no.getBoundingClientRect();

  if(!escaped){
    no.style.position='absolute';
    no.style.transform='none';
    row.style.width='100%';
    escaped=true;
  }

  const pad=8;
  const maxX=Math.max(pad,z.width-n.width-pad);
  const maxY=Math.max(pad,z.height-n.height-pad);

  let x,ypos,tries=0;
  do{
    x=pad+Math.random()*Math.max(1,maxX-pad);
    ypos=pad+Math.random()*Math.max(1,maxY-pad);
    const nx=z.left+x, ny=z.top+ypos;
    const overlap=!(nx+n.width < y.left-18 || nx > y.right+18 || ny+n.height < y.top-18 || ny > y.bottom+18);
    if(!overlap) break;
    tries++;
  }while(tries<40);

  no.style.left=x+'px';
  no.style.top=ypos+'px';
}

no.addEventListener('mouseenter',moveNo);
no.addEventListener('pointerdown',e=>{e.preventDefault();moveNo()});
no.addEventListener('touchstart',e=>{e.preventDefault();moveNo()},{passive:false});

function makeHeart(){
  const rows=35, cols=73, phrase='I love you ';
  const lines=[];
  for(let yy=0;yy<rows;yy++){
    const y=1.35-(yy/(rows-1))*2.7;
    let line='',k=0;
    for(let xx=0;xx<cols;xx++){
      const x=-1.55+(xx/(cols-1))*3.1;
      const a=x*x+y*y-1;
      const inside=(a*a*a-x*x*y*y*y)<=0;
      if(inside){line+=phrase[k%phrase.length];k++}
      else line+=' ';
    }
    lines.push(line);
  }
  return lines.join('\n');
}
const heart=makeHeart();

function typeHeart(){
  heartText.textContent='';
  finalMsg.classList.remove('show');
  replayBtn.classList.add('hidden');
  loveStatus.textContent='استنى... في حاجة بتتكتبلك';

  const voiceStart=3.5;
  const clipEnd=13.0;
  let drawing=false;
  let drawTimer=null;

  function beginDrawing(){
    if(drawing) return;
    drawing=true;
    loveStatus.textContent='I love you... ❤️';

    const duration=Math.max(1000,(clipEnd-voiceStart)*1000);
    const steps=Math.ceil(heart.length/3);
    const interval=Math.max(4,duration/steps);
    let i=0;

    drawTimer=setInterval(()=>{
      i=Math.min(i+3,heart.length);
      heartText.textContent=heart.slice(0,i);

      if(i>=heart.length){
        clearInterval(drawTimer);
        finalMsg.classList.add('show');
        replayBtn.classList.remove('hidden');
        burstHearts();
      }
    },interval);
  }

  const sync=()=>{
    if(loveAudio.currentTime>=voiceStart) beginDrawing();
  };

  loveAudio.ontimeupdate=sync;
  loveAudio.onended=()=>{
    if(!drawing) beginDrawing();
  };

  loveAudio.currentTime=0;
  const playPromise=loveAudio.play();
  if(playPromise && typeof playPromise.catch==='function'){
    playPromise.catch(()=>{
      setTimeout(beginDrawing,voiceStart*1000);
    });
  }
}
function burstHearts(){
  heartsOverlay.querySelectorAll('.float-heart').forEach(el=>el.remove());
  const symbols=['❤️','❤','♥️'];
  for(let i=0;i<150;i++){
    const h=document.createElement('span');
    h.className='float-heart';
    h.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    h.style.left=(Math.random()*100)+'vw';
    h.style.animationDelay=(Math.random()*1.8)+'s';
    h.style.animationDuration=(3.6+Math.random()*2.2)+'s';
    h.style.fontSize=(16+Math.random()*24)+'px';
    heartsOverlay.appendChild(h);
    setTimeout(()=>h.remove(),7000);
  }
}

yes.addEventListener('click',()=>{
  sorry.classList.add('hidden');
  love.classList.remove('hidden');
  typeHeart();
});
replayBtn.addEventListener('click',()=>{ loveAudio.pause(); loveAudio.currentTime=0; typeHeart(); });
</script>
</body>
</html>
